<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Content admin — Kalaayana Studios</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="bar">
      <a class="bar-brand" href="/admin/" aria-label="Kalaayana Studios">
        <span class="mark" aria-hidden="true"></span>
      </a>
      <span class="bar-title">Content admin</span>
      <button class="btn btn-ghost btn-sm bar-preview" id="preview-btn" type="button" hidden>
        Preview this page ↗
      </button>
      <span class="bar-session" id="session"></span>
      <span class="bar-user" id="who"></span>
      <a
        class="btn btn-ghost btn-sm bar-site"
        id="site-link"
        href="/"
        target="_blank"
        rel="noopener"
        >View site ↗</a
      >
      <button class="btn btn-ghost btn-sm" id="signout" type="button">Sign out</button>
    </header>

    <nav class="tabs" aria-label="Admin areas">
      <button type="button" class="tab superadmin-only" id="tab-home" data-tab="home">
        Homepage
      </button>
      <button type="button" class="tab" id="tab-projects" data-tab="projects">Projects</button>
      <button type="button" class="tab" id="tab-insights" data-tab="insights">Insights</button>
      <button type="button" class="tab superadmin-only" id="tab-log" data-tab="log">Log</button>
      <button type="button" class="tab superadmin-only" id="tab-users" data-tab="users">
        Users
      </button>
    </nav>

    <div class="shell">
      <aside class="side">
        <h2 class="side-heading">Works</h2>
        <nav class="side-list" id="sections" aria-label="Works"></nav>
        <button class="btn" id="new-project" type="button">+ New project</button>
        <button class="btn btn-ghost superadmin-only" id="new-section" type="button">
          + New work
        </button>
        <div class="side-foot">
          <p class="muted" id="base-note"></p>
        </div>
      </aside>

      <main class="main" id="main">
        <p class="muted" id="loading">Loading content from the repository…</p>
      </main>
    </div>

    <div class="savebar" id="savebar" hidden>
      <span id="pending-summary"></span>
      <input id="message" placeholder="What changed? (becomes the commit message)" maxlength="72" />
      <button class="btn btn-ghost" id="discard" type="button">Discard</button>
      <button class="btn" id="save" type="button">Preview &amp; publish</button>
    </div>

    <dialog id="result" class="dialog">
      <button class="dialog-x" id="result-x" type="button" aria-label="Close">×</button>
      <div id="result-body"></div>
      <button class="btn" id="result-close" type="button">Close</button>
    </dialog>

    <template id="tpl-project-card">
      <article class="card">
        <img class="card-thumb" alt="" />
        <div class="card-body">
          <h3 class="card-title"></h3>
          <p class="card-meta"></p>
        </div>
      </article>
    </template>

    <script src="/admin/admin.js" defer></script>
  </body>
</html>
