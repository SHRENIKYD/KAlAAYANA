<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Content admin — Kalaayana Studios</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="bar">
      <a class="bar-brand" href="/">Kalaayana Studios</a>
      <span class="bar-title">Content admin</span>
      <a
        class="bar-preview"
        id="preview-link"
        href="/"
        target="_blank"
        rel="noopener noreferrer"
        hidden
        >Preview site ↗</a
      >
      <span class="bar-user" id="who">Signing in…</span>
    </header>

    <div class="shell">
      <aside class="side">
        <h2 class="side-heading">Sections</h2>
        <nav class="side-list" id="sections" aria-label="Sections"></nav>
        <button class="btn btn-ghost" id="new-section" type="button">+ New section</button>
        <div class="side-foot">
          <p class="muted" id="base-note"></p>
        </div>
      </aside>

      <main class="main" id="main">
        <p class="muted" id="loading">Loading content from the repository…</p>
      </main>
    </div>

    <div class="savebar" id="savebar" hidden>
      <span id="pending-summary"></span>
      <input id="message" placeholder="What changed? (becomes the commit message)" maxlength="72" />
      <button class="btn btn-ghost" id="discard" type="button">Discard</button>
      <button class="btn" id="save" type="button">Save &amp; publish to staging</button>
    </div>

    <dialog id="result" class="dialog">
      <div id="result-body"></div>
      <button class="btn" id="result-close" type="button">Close</button>
    </dialog>

    <template id="tpl-project-card">
      <article class="card">
        <img class="card-thumb" alt="" />
        <div class="card-body">
          <h3 class="card-title"></h3>
          <p class="card-meta"></p>
        </div>
      </article>
    </template>

    <script src="/admin/admin.js" defer></script>
  </body>
</html>
