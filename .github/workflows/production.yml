name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  freeze:
    name: Production freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test deployment guards
        run: python3 -m unittest discover -s scripts -p 'test_deploy_guard.py'

      - name: Validate production ref and freeze
        run: python3 scripts/deploy_guard.py

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Deploy to kalaayanastudios.com
    needs: freeze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify before deploying
        run: python3 scripts/check.py

      - name: Stamp the build
        id: stamp
        run: |
          ./scripts/stamp.sh production "$GITHUB_SHA" "$GITHUB_REF_NAME"
          test ! -e dist/admin || { echo "::error::content admin must not ship to production"; exit 1; }
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    name: Confirm the live site serves this version
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Poll version.json until it matches
        env:
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          # GitHub Pages caches for 600s, so allow the edge time to turn over.
          for attempt in $(seq 1 14); do
            live="$(curl -sS --max-time 20 "https://kalaayanastudios.com/version.json?u=$RANDOM" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || echo unreadable)"
            echo "attempt $attempt: live ${live:-none}, deployed $VERSION"
            [ "$live" = "$VERSION" ] && { echo "Live site serves v$VERSION"; exit 0; }
            sleep 60
          done
          echo "::error::Deployment finished but kalaayanastudios.com still serves ${live:-nothing}, not v$VERSION"
          exit 1

  release:
    permissions:
      contents: write
    name: Tag and release
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Tag this version and cut a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — nothing to release."
            exit 0
          fi

          # The runner has no committer identity, and an annotated tag needs one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pull this version's section out of the changelog for the release body.
          # Matched literally: a bracketed version is not a usable awk regex.
          notes="$(awk -v tag="## [$VERSION]" '
            index($0, tag) == 1 {found=1; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md)"
          [ -n "$notes" ] || notes="Release $tag"

          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          printf '%s\n' "$notes" > /tmp/notes.md
          gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
          echo "Released $tag"
