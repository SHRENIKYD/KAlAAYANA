name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to kalaayanastudios.com
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify before deploying
        run: python3 scripts/check.py

      - name: Stamp the build
        id: stamp
        run: |
          ./scripts/stamp.sh production "$GITHUB_SHA" "$GITHUB_REF_NAME"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Tag and release
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag this version and cut a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — nothing to release."
            exit 0
          fi

          # The runner has no committer identity, and an annotated tag needs one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pull this version's section out of the changelog for the release body.
          # Matched literally: a bracketed version is not a usable awk regex.
          notes="$(awk -v tag="## [$VERSION]" '
            index($0, tag) == 1 {found=1; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md)"
          [ -n "$notes" ] || notes="Release $tag"

          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          printf '%s\n' "$notes" > /tmp/notes.md
          gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
          echo "Released $tag"
