name: Rollback production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to redeploy, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  freeze:
    name: Production freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test deployment guards
        run: python3 -m unittest discover -s scripts -p 'test_deploy_guard.py'

      - name: Validate production ref and freeze
        env:
          ROLLBACK_TAG: ${{ inputs.tag }}
        run: python3 scripts/deploy_guard.py

  rollback:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Redeploy ${{ inputs.tag }}
    needs: freeze
    env:
      ROLLBACK_TAG: ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Confirm the tag resolved
        run: echo "Rolling production back to $ROLLBACK_TAG ($GITHUB_SHA)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Stamp the build
        run: ./scripts/stamp.sh production "$GITHUB_SHA" "$ROLLBACK_TAG"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
