name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/kalaayana-website-pdf-eyzpld
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp asset URLs with the commit SHA
        run: |
          sha="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$sha/g" index.html
          echo "Stamped asset URLs with $sha"
          grep -n '?v=' index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
