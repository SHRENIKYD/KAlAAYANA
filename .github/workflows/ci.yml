name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test deployment guards
        run: python3 -m unittest discover -s scripts -p 'test_deploy_guard.py'

      - name: Read the base branch VERSION
        id: base
        if: github.event_name == 'pull_request'
        run: |
          base="$(git show origin/${{ github.base_ref }}:VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "Base (${{ github.base_ref }}) is at version: ${base:-none}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test privacy-safe diagnostics
        run: npm run test:diagnostics
      - name: Build
        run: npm run build
      - name: Verify version rollover rules
        run: npm run test:version
      - name: Run checks
        env:
          # Only a merge into main is a release, so only that requires notes.
          REQUIRE_RELEASE_NOTES: ${{ github.base_ref == 'main' }}
          BASE_VERSION: ${{ steps.base.outputs.version }}
          # Lets check.py tell a release apart from a staging merge, for the
          # production freeze in the FREEZE file.
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check.py

      - name: Verify the stamp script produces a deployable build
        run: |
          ./scripts/stamp.sh ci "${{ github.sha }}" "${{ github.ref_name }}"
          test -f dist/version.json
          grep -q 'name="version"' dist/index.html
