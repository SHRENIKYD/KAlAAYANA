<style>
:root{
  --ink:#0A0908;
  --line:#5E503F;
  --gold:#C6AC8F;
  --bone:#EAE0D5;
  --muted:#AC957B;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --serif:"Cinzel",Georgia,serif;
  --ease:cubic-bezier(.22,.68,.28,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--bone);
  font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.stage{position:relative;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:56px 6vw 0;text-align:center;overflow:hidden}
.bg{position:absolute;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;
  filter:saturate(.78) contrast(1.1) brightness(1.04);
  animation:drift 26s var(--ease) infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07)}}
.veil{position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse at 50% 40%,rgba(10,9,8,.06),rgba(10,9,8,.66) 78%),
             linear-gradient(180deg,rgba(10,9,8,.60),rgba(10,9,8,.14) 34%,rgba(10,9,8,.72) 82%,var(--ink))}
.inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  margin:auto 0}
.kicker{font-size:clamp(9px,1.5vw,11px);letter-spacing:.42em;text-transform:uppercase;
  color:var(--gold);margin:0 0 26px;
  opacity:0;animation:rise 1.1s var(--ease) .1s forwards}
.logo{width:min(540px,76vw);height:auto;
  filter:drop-shadow(0 6px 20px rgba(0,0,0,.95)) drop-shadow(0 22px 60px rgba(0,0,0,.75));
  opacity:0;animation:rise 1.4s var(--ease) .25s forwards}
.tagline{max-width:560px;margin:26px 0 0;color:var(--bone);opacity:0;
  font-size:clamp(.92rem,1.7vw,1.08rem);line-height:1.75;
  text-shadow:0 2px 14px rgba(0,0,0,.8);
  animation:rise 1.2s var(--ease) .55s forwards}
.soon{display:flex;align-items:center;gap:18px;margin-top:44px;
  opacity:0;animation:rise 1.2s var(--ease) .8s forwards}
.soon span{font-family:var(--serif);font-size:clamp(.82rem,1.7vw,1.05rem);
  letter-spacing:.34em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.soon i{display:block;width:clamp(28px,9vw,88px);height:1px;
  background:linear-gradient(90deg,transparent,var(--line))}
.soon i:last-child{background:linear-gradient(90deg,var(--line),transparent)}
.foot{position:relative;z-index:2;width:100%;padding:26px 0 30px;
  display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
  opacity:0;animation:rise 1.2s var(--ease) 1.05s forwards}
.foot a,.foot span{font-size:clamp(10px,1.5vw,12px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);text-decoration:none;
  transition:color .35s var(--ease)}
.foot a:hover{color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(max-width:560px){
  body{overflow:auto}
  .stage{padding:44px 7vw 0}
  .foot{gap:8px 18px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .kicker,.logo,.tagline,.soon,.foot{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<main class="stage">
  <div class="bg"><img src="assets/img/hero-hanuman.jpg" alt="" width="876" height="1558" fetchpriority="high"></div>
  <div class="veil"></div>

  <div class="inner">
    <p class="kicker">Since the 19th century · Five generations</p>
    <h1 class="logo-wrap" style="margin:0">
      <img class="logo" src="assets/img/logo.png" alt="Kalaayana Studios" width="736" height="391">
    </h1>
    <p class="tagline">Monumental sculpture, temple architecture and the living continuity of a Mysore artistic lineage.</p>
    <div class="soon"><i></i><span>Coming Soon</span><i></i></div>
  </div>

  <footer class="foot">
    <a href="mailto:kalaayanastudios@gmail.com">kalaayanastudios@gmail.com</a>
    <a href="tel:+918886870796">+91 88868 70796</a>
    <a href="https://instagram.com/kalaayana_studios" target="_blank" rel="noopener">Instagram</a>
    <span>Bangalore, Karnataka</span>
  </footer>
</main>
</body>
